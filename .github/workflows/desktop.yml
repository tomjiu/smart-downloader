name: desktop

# 桌面端三平台打包（tag desktop-v* 触发；PR 手动验证用 workflow_dispatch）
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            triple-suffix: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            triple-suffix: x86_64-pc-windows-msvc.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            triple-suffix: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build UI (static export)
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build daemon (release, no-BT desktop profile)
        run: cargo build --release -p smart-dl-daemon

      - name: Place sidecar binary
        shell: bash
        run: |
          mkdir -p desktop/binaries
          cp "target/release/smart-dl-daemon$( [ '${{ runner.os }}' = 'Windows' ] && echo '.exe' )" \
             "desktop/binaries/smart-dl-daemon-${{ matrix.triple-suffix }}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }}
          # tag 触发时发布 Release 并附安装包（矩阵三平台同 Release 并发上传，
          # tauri-action 幂等：已存在则仅追加资产）；__VERSION__ 取 tauri.conf.json
          tagName: desktop-v__VERSION__
          releaseName: Smart Downloader Desktop v__VERSION__
          releaseBody: |
            Smart Downloader 桌面端（内嵌 daemon + UI，no-BT profile）。
            - Windows：.msi / .exe（WebView2）
            - macOS（Apple Silicon）：.dmg / .app
            - Linux：.deb / .AppImage
            首次启动后数据目录：系统标准应用配置目录（任务/下载收纳于此）。
          releaseDraft: false
          prerelease: false

      - name: Upload bundles (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: smart-dl-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/*/release/bundle/**/*
