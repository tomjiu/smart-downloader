[package]
name = "smart-dl-btcore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
smart-dl-core = { path = "../core" }
fs2 = { workspace = true }

# Xunlei BT 引擎（Windows-only，免登录匿名模式）。
xunlei-ffi = { path = "../../crates/xunlei-ffi", optional = true }

# NAS 远程引擎（XunleiNas，附录 E）：pan-auth HTTP 协议面，全平台可用。
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[build-dependencies]
bindgen = "0.71"

[features]
xunlei = ["dep:xunlei-ffi"]
nas = ["dep:reqwest", "dep:serde_json"]
