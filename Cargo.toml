[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/btcore",
    "crates/httpdl",
    "crates/provider",
    "crates/daemon",
    "crates/xunlei-ffi",
    "crates/xunlei-convert",
]
# spike/cxx 是临时对比 spike,独立构建,排除出主 workspace
exclude = ["spike/cxx"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Task 5-a（2026-08-30）：dev/test 只保留行表级调试信息。
# 背景：9.9G 磁盘下，全量 debuginfo（默认 2）使每个 daemon 测试二进制 ~100MB，
# 并行代理反复构建即撑爆磁盘（ld Bus error / No space left）。
# line-tables-only 保留回溯行号，二进制体积约减半；release 不受影响。
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.dependencies]
percent-encoding = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
# TLS 后端（P1-3 安卓交叉，2026-08-31）：default-features=false 关掉 native-tls
#（openssl-sys 需要目标平台 openssl 头，Android/termux 交叉编译即断点），
# 改用纯 Rust rustls（ring 有 aarch64-android asm 支路，NDK clang 直接编）。
# 同时去掉 macos-system-configuration（仅影响 macOS 系统代理自动探测；
# daemon 代理由 [download] proxy 显式配置，不受影响）。Linux x86_64 回归：
# 全量单测通过（P4-2 验收记录）。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "charset",
    "http2",
] }
tracing = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
url = "2"
sha1 = "0.10"
base64 = "0.22"
fs2 = "0.4"
parking_lot = "0.12"
